name: coursehub-prod

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${DB_PASSWORD}
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P '${DB_PASSWORD}' -C -Q 'SELECT 1' || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  api:
    image: ghcr.io/trongduongtkhd/coursehub-api:latest
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Server=db,1433;Database=CourseHubDb;User Id=sa;Password=${DB_PASSWORD};TrustServerCertificate=True;"
      ConnectionStrings__Redis: "redis:6379"
      Jwt__Key: ${JWT_KEY}
      Seed__AdminPassword: ${SEED_ADMIN_PASSWORD}
      Seed__InstructorPassword: ${SEED_INSTRUCTOR_PASSWORD}
    volumes:
      - uploads:/app/wwwroot/uploads
      - logs:/app/Logs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  web:
    image: ghcr.io/trongduongtkhd/coursehub-web:latest
    restart: unless-stopped
    environment:
      API_URL: http://api:8080
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - api

  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://web:80
    depends_on:
      - web

volumes:
  sqldata:
  uploads:
  logs:
