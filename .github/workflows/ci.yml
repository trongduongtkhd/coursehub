name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend - build & test
    runs-on: ubuntu-latest

    steps:
      - name: Tải code về
        uses: actions/checkout@v4

      - name: Cài .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore backend

      - name: Build
        run: dotnet build backend --no-restore --configuration Release

      - name: Chạy Unit Test
        run: dotnet test backend --no-build --configuration Release

  frontend:
    name: Frontend - build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Tải code về
        uses: actions/checkout@v4

      - name: Cài Node 14
        uses: actions/setup-node@v4
        with:
          node-version: "14"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Nâng npm lên bản 8
        run: npm install -g npm@8

      - name: Cài thư viện
        run: npm ci

      - name: Build production
        run: npm run build -- --configuration production

  publish:
    name: CD - Publish Docker images
    needs: [backend, frontend]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Tải code về
        uses: actions/checkout@v4

      - name: Chuẩn bị công cụ build Docker
        uses: docker/setup-buildx-action@v3

      - name: Đăng nhập GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build và đẩy image backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/coursehub-api:latest
            ghcr.io/${{ github.repository_owner }}/coursehub-api:${{ github.sha }}

      - name: Build và đẩy image frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/coursehub-web:latest
            ghcr.io/${{ github.repository_owner }}/coursehub-web:${{ github.sha }}
