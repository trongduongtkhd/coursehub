<div class="course-list">
  <div class="header">
    <h2>Danh sách khóa học</h2>
    <a *ngIf="canCreate" routerLink="/courses/new">+ Tạo khóa học</a>
  </div>

  <p *ngIf="loading">Đang tải...</p>
  <p *ngIf="!loading && courses.length === 0">Chưa có khóa học nào.</p>

  <div class="course-card" *ngFor="let course of courses">
    <a [routerLink]="['/courses', course.id]"
      ><h3>{{ course.title }}</h3></a
    >
    <p>{{ course.description }}</p>
    <small>Giảng viên: {{ course.instructorName }} · {{ course.status }}</small>
  </div>
</div>
