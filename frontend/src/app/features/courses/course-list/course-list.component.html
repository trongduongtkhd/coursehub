<div class="page-container">
  <div class="page-header">
    <h2>Danh sách khóa học</h2>
    <a *ngIf="canCreate" routerLink="/courses/new" class="btn-primary"
      >+ Tạo khóa học</a
    >
  </div>

  <div class="course-filters">
    <input
      type="text"
      [formControl]="searchControl"
      placeholder="Tìm kiếm khóa học..."
      class="course-filters__search"
    />
    <select [(ngModel)]="statusFilter" (change)="onStatusChange()">
      <option value="">Tất cả trạng thái</option>
      <option value="Published">Published</option>
      <option value="Draft">Draft</option>
      <option value="Archived">Archived</option>
    </select>
  </div>

  <p *ngIf="loading">Đang tải...</p>

  <div *ngIf="!loading && result?.items?.length === 0" class="empty-state">
    Không tìm thấy khóa học nào.
  </div>

  <div
    class="course-grid"
    *ngIf="!loading && result && result.items.length > 0"
  >
    <div class="card course-card" *ngFor="let course of result.items">
      <img
        *ngIf="course.thumbnailUrl"
        [src]="course.thumbnailUrl | apiImage"
        class="course-card__thumbnail"
        alt=""
      />
      <h3>
        <a [routerLink]="['/courses', course.id]">{{ course.title }}</a>
      </h3>
      <p class="description">{{ course.description }}</p>
      <div class="course-card__rating" *ngIf="course.reviewCount > 0">
        <app-star-rating
          [rating]="course.averageRating"
          [readonly]="true"
        ></app-star-rating>
        <span>{{ course.averageRating }} ({{ course.reviewCount }})</span>
      </div>
      <div class="meta">
        <span>{{ course.instructorName }}</span>
        <span
          class="badge"
          [ngClass]="'badge-' + course.status.toLowerCase()"
          >{{ course.status }}</span
        >
      </div>
    </div>
  </div>

  <div class="pagination" *ngIf="result && result.totalPages > 1">
    <button
      type="button"
      class="btn-secondary"
      [disabled]="currentPage === 1"
      (click)="goToPage(currentPage - 1)"
    >
      ← Trước
    </button>
    <span>Trang {{ currentPage }} / {{ result.totalPages }}</span>
    <button
      type="button"
      class="btn-secondary"
      [disabled]="currentPage === result.totalPages"
      (click)="goToPage(currentPage + 1)"
    >
      Sau →
    </button>
  </div>
</div>
