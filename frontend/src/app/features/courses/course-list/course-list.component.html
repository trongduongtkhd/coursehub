<div class="page-container">
  <div class="page-header">
    <h2>Danh sách khóa học</h2>
    <a *ngIf="canCreate" routerLink="/courses/new" class="btn-primary"
      >+ Tạo khóa học</a
    >
  </div>

  <p *ngIf="loading">Đang tải...</p>

  <div *ngIf="!loading && courses.length === 0" class="empty-state">
    Chưa có khóa học nào.
  </div>

  <div class="course-grid" *ngIf="!loading && courses.length > 0">
    <a
      class="card course-card"
      *ngFor="let course of courses"
      [routerLink]="['/courses', course.id]"
    >
      <h3>{{ course.title }}</h3>
      <p class="description">{{ course.description }}</p>
      <div class="meta">
        <span>{{ course.instructorName }}</span>
        <span
          class="badge"
          [ngClass]="'badge-' + course.status.toLowerCase()"
          >{{ course.status }}</span
        >
      </div>
    </a>
  </div>
</div>
