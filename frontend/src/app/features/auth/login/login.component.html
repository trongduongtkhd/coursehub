<div class="auth-page">
  <div class="auth-card">
    <h2>Đăng nhập</h2>
    <p class="subtitle">Chào mừng quay lại CourseHub</p>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="form-field">
        <label>Email</label>
        <input
          type="email"
          formControlName="email"
          placeholder="ban@email.com"
        />
      </div>
      <div class="form-field">
        <label>Mật khẩu</label>
        <input
          type="password"
          formControlName="password"
          placeholder="••••••••"
        />
      </div>
      <p *ngIf="errorMessage" class="error-message">{{ errorMessage }}</p>
      <button
        type="submit"
        class="btn-primary"
        [disabled]="form.invalid || loading"
      >
        {{ loading ? "Đang đăng nhập..." : "Đăng nhập" }}
      </button>
    </form>

    <a class="switch-link" routerLink="/auth/register"
      >Chưa có tài khoản? <strong>Đăng ký ngay</strong></a
    >
  </div>
</div>
